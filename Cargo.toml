[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LIBRA-PARK/anvil"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
# specta 계열은 아직 RC라서 반드시 정확한 버전(=)으로 고정한다.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

# 모든 크레이트에 공통 적용되는 린트 규칙 (CI에서는 경고도 실패 처리)
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# 바이너리 크기와 성능 최적화
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
