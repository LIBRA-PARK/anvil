[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
# 바이너리 크기와 성능 최적화
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
