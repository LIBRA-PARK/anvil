[package]
name = "anvil"
description = "SSH · SFTP · Git · 에디터를 하나로 묶은 크로스플랫폼 개발 도구"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# 모바일 빌드 호환을 위해 Tauri 권장 구성 사용
name = "anvil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Tauri를 링크하는 테스트는 tests/ 통합 테스트로만 작성한다.
# (Windows에서 lib 단위 테스트 바이너리에는 매니페스트를 넣을 수 없음, build.rs 참고)
test = false
doctest = false

[[bin]]
name = "anvil"
path = "src/main.rs"
test = false

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
core-config = { path = "../crates/core-config" }
core-ssh = { path = "../crates/core-ssh" }
uuid.workspace = true
